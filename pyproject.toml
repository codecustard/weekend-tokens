[project]
name = "weekend-tokens"
version = "0.1.0"
description = "Do weekend tokenized-stock prices predict Monday's open gap beyond index futures?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weekend_tokens"]

[tool.ruff]
line-length = 100
